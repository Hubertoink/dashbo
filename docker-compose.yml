services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashbo}
      POSTGRES_USER: ${POSTGRES_USER:-dashbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashbo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  db_backup:
    build:
      context: ./ops/db-backup
    profiles:
      - backup
    depends_on:
      - db
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-dashbo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dashbo}
      PGDATABASE: ${POSTGRES_DB:-dashbo}
      BACKUP_DIR: /backups
      BACKUP_PREFIX: ${DB_BACKUP_PREFIX:-dashbo}
      BACKUP_KEEP_DAYS: ${DB_BACKUP_KEEP_DAYS:-14}
      BACKUP_CRON: ${DB_BACKUP_CRON:-0 3 * * *}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - db_backups:/backups

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dashbo}
      DB_USER: ${POSTGRES_USER:-dashbo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dashbo}
      PORT: ${BACKEND_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-dashbo-dev-secret-change-me}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      MAIN_ADMIN_EMAIL: ${MAIN_ADMIN_EMAIL:-}
      # Keep DATABASE_URL as a fallback, but prefer DB_* parts so passwords with
      # special characters are URL-encoded safely on hosts like Mittwald.
      DATABASE_URL: postgres://${POSTGRES_USER:-dashbo}:${POSTGRES_PASSWORD:-dashbo}@db:5432/${POSTGRES_DB:-dashbo}
      OWM_API_KEY: ${OWM_API_KEY}
      OWM_LAT: ${OWM_LAT:-49.4875}
      OWM_LON: ${OWM_LON:-8.4660}
      OWM_UNITS: ${OWM_UNITS:-metric}
      OWM_LANG: ${OWM_LANG:-de}
      UPLOAD_DIR: /data/uploads
      OUTLOOK_TENANT: ${OUTLOOK_TENANT:-consumers}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
      OUTLOOK_REDIRECT_URI: ${OUTLOOK_REDIRECT_URI:-}
      OUTLOOK_SCOPES: ${OUTLOOK_SCOPES:-offline_access Calendars.ReadWrite User.Read Tasks.ReadWrite}
      OUTLOOK_SUCCESS_REDIRECT: ${OUTLOOK_SUCCESS_REDIRECT:-/settings}
      OUTLOOK_ERROR_REDIRECT: ${OUTLOOK_ERROR_REDIRECT:-/settings?outlook=error}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_SCOPES: ${GOOGLE_SCOPES:-openid email profile https://www.googleapis.com/auth/calendar}
      GOOGLE_SUCCESS_REDIRECT: ${GOOGLE_SUCCESS_REDIRECT:-/settings}
      GOOGLE_ERROR_REDIRECT: ${GOOGLE_ERROR_REDIRECT:-/settings?google=error}
      HUE_BRIDGE_URL: ${HUE_BRIDGE_URL:-}
      HUE_APP_KEY: ${HUE_APP_KEY:-}
      HUE_ALLOW_SELF_SIGNED: ${HUE_ALLOW_SELF_SIGNED:-true}
      DASHBO_DATA_REFRESH_MS: ${DASHBO_DATA_REFRESH_MS:-60000}
      TODO_LIST_NAME: ${TODO_LIST_NAME:-Dashbo}
      # Public base URL of the frontend (used for email links)
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # SMTP (for password reset + email verification)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  db_backups:
  backend_data:
